name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          purescript: "0.14.0"
          psa: "0.8.2"
          spago: "0.19.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: purescript-contrib/setup-purescript@main
        with:
          spago: "1.0.5"

      - run: spago build

      - run: spago test
